<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add site</title>
    <!--
      The trusted add-site form. This page is a first-class bundle entry
      (see vite.config.ts rollupOptions.input) served to the small
      `webpanel-add` window Rust opens via open_web_panel_add_window —
      never to the main window, never with query params. The typed values
      are the owner-intent proof that lets add_custom_panel accept a URL
      over IPC from THIS webview only (the command checks the caller's
      webview label first).
    -->
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: light-dark(#ffffff, #09090b);
        color: light-dark(#18181b, #f4f4f5);
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 360px;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 13px;
        font-weight: 500;
      }
      input {
        font: inherit;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid light-dark(#d4d4d8, #3f3f46);
        background: light-dark(#ffffff, #18181b);
        color: inherit;
      }
      input:focus {
        outline: 2px solid light-dark(#2563eb, #3b82f6);
        outline-offset: -1px;
      }
      #buzz-add-error {
        min-height: 16px;
        margin: 0;
        font-size: 12px;
        color: light-dark(#dc2626, #f87171);
        white-space: pre-wrap;
      }
      #buzz-add-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      button {
        font: inherit;
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid transparent;
        cursor: pointer;
      }
      button[type="button"] {
        background: transparent;
        border-color: light-dark(#d4d4d8, #3f3f46);
        color: inherit;
      }
      button[type="submit"] {
        background: light-dark(#2563eb, #3b82f6);
        color: #fff;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <!--
      No native submit: CSP pins form-action 'none', and the handler calls
      preventDefault anyway — the form exists for Enter-key affordance.
    -->
    <form id="buzz-add-form">
      <label>
        Name
        <input autocomplete="off" id="buzz-add-label" maxlength="64" required type="text" />
      </label>
      <label>
        URL
        <input autocomplete="off" id="buzz-add-url" placeholder="https://example.com" required type="url" />
      </label>
      <p id="buzz-add-error" role="alert"></p>
      <div id="buzz-add-buttons">
        <button id="buzz-add-cancel" type="button">Cancel</button>
        <button id="buzz-add-submit" type="submit">Add</button>
      </div>
    </form>
    <script type="module" src="/src/features/webPanels/addWindow.ts"></script>
  </body>
</html>
