<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Buzz: jump to channel or DM</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI','Helvetica Neue',sans-serif;color:#1B1A16;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,monospace}
.hex{clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;cursor:pointer}
input{font:inherit}
input::placeholder{color:#8A8478}
a{color:#1F4E8C}a:hover{color:#163A6A}
</style>
</helmet>
<div style="width: 1000px; height: 720px; position: relative; overflow: hidden; background: #FDFCF9; font-size: 14px; line-height: 1.45">

  <!-- app behind the dialog -->
  <div aria-hidden="true" style="position: absolute; inset: 0; display: flex">
    <div style="width: 240px; background: #F2EFE8; border-right: 1px solid #E6E2D8; padding: 20px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
      <div style="height: 32px; width: 120px; border-radius: 8px; background: #E3DFD4"></div>
      <div style="height: 34px; border-radius: 9px; background: #FDFCF9; border: 1px solid #E6E2D8"></div>
      <div style="height: 10px; width: 70%; border-radius: 5px; background: #E3DFD4; margin-top: 12px"></div>
      <div style="height: 10px; width: 55%; border-radius: 5px; background: #E3DFD4"></div>
      <div style="height: 10px; width: 62%; border-radius: 5px; background: #E3DFD4"></div>
      <div style="height: 10px; width: 48%; border-radius: 5px; background: #E3DFD4"></div>
    </div>
    <div style="flex-grow: 1; padding: 24px; display: flex; flex-direction: column; gap: 18px">
      <div style="height: 14px; width: 220px; border-radius: 7px; background: #EDEAE2"></div>
      <div style="height: 10px; width: 80%; border-radius: 5px; background: #F2EFE8; margin-top: 30px"></div>
      <div style="height: 10px; width: 64%; border-radius: 5px; background: #F2EFE8"></div>
      <div style="height: 10px; width: 72%; border-radius: 5px; background: #F2EFE8"></div>
    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(27,26,22,.34)"></div>

  <!-- dialog -->
  <div role="dialog" aria-label="Jump to" style="position: absolute; left: 180px; top: 64px; width: 640px; background: #FFFFFF; border: 1px solid #E6E2D8; border-radius: 16px; box-shadow: 0 40px 80px -30px rgba(27,26,22,.6), 0 8px 20px -10px rgba(27,26,22,.25); overflow: hidden">

    <div style="display: flex; align-items: center; gap: 12px; height: 58px; padding: 0 18px; border-bottom: 1px solid #EFECE4">
      <svg class="ic" viewBox="0 0 24 24" style="width: 18px; height: 18px; color: #6B655A"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <div style="position: relative; flex-grow: 1; height: 32px">
        <div aria-hidden="true" style="position: absolute; inset: 0; display: flex; align-items: center; font-size: 17px; white-space: pre; pointer-events: none"><span style="color: transparent">{{ query }}</span><span style="color: #A7A194">{{ ghost }}</span></div>
        <input aria-label="Jump to a channel, person or command" value="{{ query }}" onChange="{{ onInput }}" onKeyDown="{{ onKey }}" placeholder="Jump to a channel, person or command" autocomplete="off" spellcheck="false" style="position: absolute; inset: 0; width: 100%; border: 0; outline: none; background: transparent; padding: 0; margin: 0; font-size: 17px; color: #1B1A16">
      </div>
      <sc-if value="{{ hasGhost }}" hint-placeholder-val="{{ true }}">
        <span class="mono" style="font-size: 11px; color: #45423B; background: #F2EFE8; border-radius: 5px; padding: 1px 6px; white-space: nowrap">Tab to complete</span>
      </sc-if>
      <span class="mono" style="font-size: 11px; color: #6B655A; border: 1px solid #DDD8CC; border-radius: 5px; padding: 0 5px">esc</span>
    </div>

    <div style="display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-bottom: 1px solid #EFECE4">
      <sc-for list="{{ scopes }}" as="s" hint-placeholder-count="4">
        <button onClick="{{ s.pick }}" aria-pressed="{{ s.pressed }}" style="height: 26px; padding: 0 10px; border-radius: 7px; border: 1px solid {{ s.border }}; background: {{ s.bg }}; color: {{ s.fg }}; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px">{{ s.label }}<span class="mono" style="font-size: 10.5px; opacity: .7">{{ s.key }}</span></button>
      </sc-for>
    </div>

    <div role="listbox" style="height: 420px; overflow-y: auto; padding: 6px">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
        <sc-if value="{{ r.isHeader }}" hint-placeholder-val="{{ false }}">
          <div style="font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #6B655A; padding: 10px 10px 4px">{{ r.header }}</div>
        </sc-if>
        <sc-if value="{{ r.isRow }}" hint-placeholder-val="{{ true }}">
          <button role="option" aria-selected="{{ r.selected }}" onClick="{{ r.open }}" style="width: 100%; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border: 0; border-radius: 9px; background: {{ r.bg }}; color: #1B1A16; text-align: left; font-size: 14px">
            <sc-if value="{{ r.isChannel }}" hint-placeholder-val="{{ true }}">
              <span style="width: 22px; text-align: center; color: #8A8478; font-weight: 500; font-size: 15px">#</span>
            </sc-if>
            <sc-if value="{{ r.isScratch }}" hint-placeholder-val="{{ false }}">
              <span style="width: 22px; display: grid; place-items: center; color: #7F5200"><svg class="ic" viewBox="0 0 24 24" style="width: 15px; height: 15px; stroke-dasharray: 3 2.4"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"></path></svg></span>
            </sc-if>
            <sc-if value="{{ r.isDm }}" hint-placeholder-val="{{ false }}">
              <span class="hex" style="width: 22px; height: 25.4px; background: {{ r.ring }}; display: grid; place-items: center; flex-shrink: 0"><span class="hex mono" style="width: 18px; height: 20.8px; background: {{ r.ink }}; color: #F6F1E4; display: grid; place-items: center; font-size: 7px; font-weight: 600">{{ r.initials }}</span></span>
            </sc-if>
            <sc-if value="{{ r.isAction }}" hint-placeholder-val="{{ false }}">
              <span style="width: 22px; height: 22px; border-radius: 6px; background: #F2EFE8; display: grid; place-items: center; color: #45423B"><svg class="ic" viewBox="0 0 24 24" style="width: 13px; height: 13px"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
            </sc-if>
            <sc-if value="{{ r.isSearch }}" hint-placeholder-val="{{ false }}">
              <span style="width: 22px; display: grid; place-items: center; color: #6B655A"><svg class="ic" viewBox="0 0 24 24" style="width: 15px; height: 15px"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></span>
            </sc-if>
            <span style="white-space: pre; overflow: hidden; text-overflow: ellipsis">{{ r.pre }}<b style="font-weight: 700; background: #FCF0D2; border-radius: 3px">{{ r.mid }}</b>{{ r.post }}</span>
            <span style="margin-left: auto; font-size: 12px; color: {{ r.hintColor }}; white-space: nowrap">{{ r.hint }}</span>
            <sc-if value="{{ r.selected }}" hint-placeholder-val="{{ false }}">
              <span class="mono" style="font-size: 11px; color: #45423B; background: #FFFFFF; border: 1px solid #DDD8CC; border-radius: 5px; padding: 0 5px">↵</span>
            </sc-if>
          </button>
        </sc-if>
      </sc-for>
      <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
        <div style="padding: 24px 12px; font-size: 13px; color: #6B655A">Nothing matches. Press ↵ to search messages instead.</div>
      </sc-if>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 16px; border-top: 1px solid #EFECE4; background: #FAF8F4; font-size: 12px; color: #6B655A">
      <sc-if value="{{ hasOpened }}" hint-placeholder-val="{{ false }}">
        <span style="display: inline-flex; align-items: center; gap: 6px; color: #1C6644; font-weight: 600"><svg class="ic" viewBox="0 0 24 24" style="width: 14px; height: 14px"><path d="M20 6 9 17l-5-5"></path></svg>Opening {{ opened }}</span>
      </sc-if>
      <span class="mono" style="margin-left: auto; font-size: 11px">↑↓ move · Tab complete · ↵ open</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startQuery":{"editor":"text","default":"en"},"$preview":{"width":1000,"height":720}}'>
class Component extends DCLogic {
  items() {
    return [
      { group: 'channel', label: 'flight-path', hint: 'Lord Nikon needs you', hot: true },
      { group: 'channel', label: 'engineering', hint: '2 agents working' },
      { group: 'channel', label: 'announcements', hint: 'unread' },
      { group: 'channel', label: 'design', hint: '' },
      { group: 'channel', label: 'general', hint: '' },
      { group: 'channel', label: 'marketing', hint: '' },
      { group: 'channel', label: 'mobile', hint: '1 agent working' },
      { group: 'channel', label: 'pipelines', hint: '1 agent working' },
      { group: 'channel', label: 'queen-bee-launch', hint: 'private' },
      { group: 'scratch', label: 'flight-path / scratch-1', hint: 'scratch · 1 working' },
      { group: 'scratch', label: 'engineering / jitter-qa', hint: 'scratch · idle 40m' },
      { group: 'dm', label: 'Gilfoyle', initials: 'GF', ink: '#24231F', ring: '#D5D0C4', hint: 'idle · 1 unread' },
      { group: 'dm', label: 'Lord Nikon', initials: 'LN', ink: '#243449', ring: '#EBA21A', hint: 'working in #flight-path' },
      { group: 'dm', label: 'Acid Burn', initials: 'AB', ink: '#452536', ring: '#EBA21A', hint: 'working in #engineering' },
      { group: 'dm', label: 'Evie', initials: 'EV', ink: '#1F3A30', ring: '#D5D0C4', hint: 'idle' },
      { group: 'dm', label: 'Jared Dunn', initials: 'JD', ink: '#2F3524', ring: '#EBA21A', hint: 'working in #pipelines' },
      { group: 'dm', label: 'Crash Override', initials: 'CO', ink: '#3A2E22', ring: '#EBA21A', hint: 'working in #mobile' },
      { group: 'dm', label: 'Cereal Killer', initials: 'CK', ink: '#2A2A33', ring: '#E0553A', hint: 'needs you', hot: true },
      { group: 'dm', label: 'Richard Hendricks', initials: 'RH', ink: '#2B3340', ring: '#D5D0C4', hint: 'idle' },
      { group: 'dm', label: 'Dinesh', initials: 'DN', ink: '#33302A', ring: '#D5D0C4', hint: 'idle' },
      { group: 'action', label: 'New scratch channel', hint: '/new' },
      { group: 'action', label: 'Add to backlog', hint: '/backlog' },
      { group: 'action', label: 'File a bug', hint: '/bug' },
      { group: 'action', label: 'Open Ops', hint: 'usage + crichton' },
      { group: 'action', label: 'Open reminders', hint: '1 due' }
    ];
  }

  score(label, q) {
    const l = label.toLowerCase();
    if (!q) return 1;
    if (l.startsWith(q)) return 3;
    if (l.split(/[\s\-\/]+/).some((w) => w.startsWith(q))) return 2;
    return l.includes(q) ? 1 : 0;
  }

  renderVals() {
    const s = this.state || {};
    const raw = s.query === undefined ? (this.props.startQuery ?? 'en') : s.query;
    const sel = s.sel || 0;
    const opened = s.opened || '';

    let scope = 'all';
    let prefix = '';
    let q = raw.trim().toLowerCase();
    if (q[0] === '#') { scope = 'channel'; prefix = raw[0]; q = q.slice(1); }
    else if (q[0] === '@') { scope = 'dm'; prefix = raw[0]; q = q.slice(1); }
    else if (q[0] === '/') { scope = 'action'; prefix = raw[0]; q = q.slice(1); }

    const all = this.items().map((it, i) => ({ ...it, order: i }));
    const inScope = (it) => scope === 'all' || it.group === scope || (scope === 'channel' && it.group === 'scratch');

    let hits;
    if (!q && scope === 'all') {
      const recent = ['flight-path', 'Lord Nikon', 'engineering', 'flight-path / scratch-1', 'Gilfoyle'];
      hits = recent.map((name) => all.find((it) => it.label === name)).filter(Boolean).map((it) => ({ ...it, score: 1 }));
    } else {
      hits = all
        .filter(inScope)
        .map((it) => ({ ...it, score: this.score(it.label, q) }))
        .filter((it) => it.score > 0)
        .sort((a, b) => (b.score - a.score) || (a.order - b.order));
    }

    const top = hits[0];
    const ghost = q && top && top.label.toLowerCase().startsWith(q) ? top.label.slice(q.length) : '';

    const groupName = { channel: 'Channels', scratch: 'Scratch', dm: 'Direct messages', action: 'Actions' };
    const sections = [];
    if (!q && scope === 'all') {
      sections.push({ header: 'Recent', items: hits });
    } else if (hits.length) {
      sections.push({ header: 'Top hit', items: [top] });
      ['channel', 'scratch', 'dm', 'action'].forEach((g) => {
        const rest = hits.slice(1).filter((h) => h.group === g);
        if (rest.length) sections.push({ header: groupName[g], items: rest });
      });
    }

    const selectable = [];
    const rows = [];
    sections.forEach((sec) => {
      rows.push({ isHeader: true, isRow: false, header: sec.header });
      sec.items.forEach((it) => {
        const idx = selectable.length;
        const l = it.label.toLowerCase();
        const at = q ? l.indexOf(q) : -1;
        const openLabel = (it.group === 'channel' || it.group === 'scratch') ? '#' + it.label : it.label;
        selectable.push(openLabel);
        rows.push({
          isHeader: false,
          isRow: true,
          isChannel: it.group === 'channel',
          isScratch: it.group === 'scratch',
          isDm: it.group === 'dm',
          isAction: it.group === 'action',
          isSearch: false,
          initials: it.initials || '',
          ink: it.ink || '#24231F',
          ring: it.ring || '#D5D0C4',
          pre: at >= 0 ? it.label.slice(0, at) : it.label,
          mid: at >= 0 ? it.label.slice(at, at + q.length) : '',
          post: at >= 0 ? it.label.slice(at + q.length) : '',
          hint: it.hint || '',
          hintColor: it.hot ? '#A2301A' : '#6B655A',
          selected: idx === sel,
          bg: idx === sel ? '#F2EFE8' : 'transparent',
          open: () => this.setState({ sel: idx, opened: openLabel })
        });
      });
    });

    if (q) {
      const idx = selectable.length;
      const label = 'message search for "' + q + '"';
      selectable.push(label);
      rows.push({ isHeader: true, isRow: false, header: 'Messages' });
      rows.push({
        isHeader: false, isRow: true, isChannel: false, isScratch: false, isDm: false, isAction: false, isSearch: true,
        initials: '', ink: '', ring: '',
        pre: 'Search messages for "', mid: q, post: '"',
        hint: 'full text', hintColor: '#6B655A',
        selected: idx === sel,
        bg: idx === sel ? '#F2EFE8' : 'transparent',
        open: () => this.setState({ sel: idx, opened: label })
      });
    }

    const scopeDefs = [
      { id: 'all', label: 'All', key: '' },
      { id: 'channel', label: 'Channels', key: '#' },
      { id: 'dm', label: 'People', key: '@' },
      { id: 'action', label: 'Commands', key: '/' }
    ];
    const scopes = scopeDefs.map((d) => {
      const on = d.id === scope;
      return {
        label: d.label,
        key: d.key,
        pressed: on ? 'true' : 'false',
        bg: on ? '#1B1A16' : '#FFFFFF',
        fg: on ? '#FDFCF9' : '#45423B',
        border: on ? '#1B1A16' : '#E6E2D8',
        pick: () => this.setState({ query: d.key + q, sel: 0, opened: '' })
      };
    });

    return {
      query: raw,
      ghost,
      hasGhost: !!ghost,
      rows,
      scopes,
      empty: !rows.length,
      opened,
      hasOpened: !!opened,
      onInput: (e) => this.setState({ query: e.target.value, sel: 0, opened: '' }),
      onKey: (e) => {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          this.setState({ sel: Math.min(sel + 1, Math.max(selectable.length - 1, 0)) });
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          this.setState({ sel: Math.max(sel - 1, 0) });
        } else if (e.key === 'Tab' && ghost) {
          e.preventDefault();
          this.setState({ query: prefix + top.label, sel: 0 });
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (selectable[sel]) this.setState({ opened: selectable[sel] });
        } else if (e.key === 'Escape') {
          this.setState({ query: '', sel: 0, opened: '' });
        }
      }
    };
  }
}
</script>
</body>
</html>
