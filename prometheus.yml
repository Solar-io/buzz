# Local dev Prometheus config — scrapes buzz-relay metrics.
# The relay runs containerized (deploy/compose, compose project `buzz-dev`,
# network buzz-dev_buzz-net) and never publishes its metrics port to the
# host, so this bundle joins that network and scrapes the container by name.
# Default metrics port is 9102; override with BUZZ_METRICS_PORT.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: buzz-relay
    static_configs:
      - targets: ["buzz-dev-relay-1:9102"]
